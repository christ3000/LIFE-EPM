# Pile locale : base persistante, API, interface web, worker et tunnel de partage facultatif.
services:
  # PostgreSQL ; les données survivent aux redémarrages grâce au volume nommé.
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: life_epm
      POSTGRES_USER: life_epm
      POSTGRES_PASSWORD: ${LIFE_EPM_DATABASE_PASSWORD:?Set LIFE_EPM_DATABASE_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U life_epm -d life_epm"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # Redis sert de file de messages aux tâches en arrière-plan.
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # API FastAPI ; la base et les secrets sont configurés dans le fichier .env.
  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://life_epm:${LIFE_EPM_DATABASE_PASSWORD}@db:5432/life_epm
      JWT_SECRET: ${LIFE_EPM_JWT_SECRET:?Set LIFE_EPM_JWT_SECRET in .env}
      BOOTSTRAP_ADMIN_USERNAME: ${LIFE_EPM_ADMIN_USERNAME:-pasteur.bobou}
      BOOTSTRAP_ADMIN_PASSWORD: ${LIFE_EPM_ADMIN_PASSWORD:?Set LIFE_EPM_ADMIN_PASSWORD in .env}
      BOOTSTRAP_ADMIN_FULL_NAME: ${LIFE_EPM_ADMIN_FULL_NAME:-Pasteur BOBOU Josue E.}
      DEMO_DATA_ENABLED: ${LIFE_EPM_DEMO_DATA_ENABLED:-false}
      CHURCH_NAME: ${LIFE_EPM_CHURCH_NAME:-Église Pentecôte Missionnaire}
      CHURCH_INITIALS: ${LIFE_EPM_CHURCH_INITIALS:-EPM}
      CHURCH_CITY: ${LIFE_EPM_CHURCH_CITY:-Abidjan}
      FRONTEND_ORIGIN: ${LIFE_EPM_FRONTEND_ORIGIN:-http://localhost:3000}
      COOKIE_SECURE: ${LIFE_EPM_COOKIE_SECURE:-false}
      SMS_PROVIDER: ${LIFE_EPM_SMS_PROVIDER:-disabled}
      SMS_USERNAME: ${LIFE_EPM_SMS_USERNAME:-}
      SMS_API_KEY: ${LIFE_EPM_SMS_API_KEY:-}
      SMS_SENDER: ${LIFE_EPM_SMS_SENDER:-}
      SMS_SANDBOX: ${LIFE_EPM_SMS_SANDBOX:-true}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${LIFE_EPM_API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 8
    restart: unless-stopped

  # Traite les tâches en arrière-plan ; l'envoi de SMS est désactivé par défaut.
  worker:
    build:
      context: ./backend
    command: ["celery", "-A", "app.worker.celery_app", "worker", "--loglevel=INFO"]
    environment:
      SMS_PROVIDER: ${LIFE_EPM_SMS_PROVIDER:-disabled}
      SMS_USERNAME: ${LIFE_EPM_SMS_USERNAME:-}
      SMS_API_KEY: ${LIFE_EPM_SMS_API_KEY:-}
      SMS_SENDER: ${LIFE_EPM_SMS_SENDER:-}
      SMS_SANDBOX: ${LIFE_EPM_SMS_SANDBOX:-true}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Interface Next.js ; laisser l'URL publique de l'API vide pour utiliser le proxy intégré.
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        API_INTERNAL_URL: ${LIFE_EPM_API_INTERNAL_URL:-http://api:8000}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    ports:
      - "${LIFE_EPM_WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # Tunnel Cloudflare temporaire, activé seulement pour partager une démonstration.
  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --url http://web:3000
    profiles: ["share"]
    depends_on:
      web:
        condition: service_started
    restart: unless-stopped

# Le volume nommé conserve les données indépendamment du cycle de vie des conteneurs.
volumes:
  postgres_data:
